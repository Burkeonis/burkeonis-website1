name = "self-mirror-api"
main = "src/index.ts"
compatibility_date = "2026-07-01"

[vars]
ENVIRONMENT = "development"
APP_ORIGIN = "http://localhost:5173"
FIREBASE_PROJECT_ID = "replace-in-cloudflare"
STRIPE_MONTHLY_PRICE_ID = "replace-in-cloudflare"
STRIPE_YEARLY_PRICE_ID = "replace-in-cloudflare"
BILLING_ENABLED = "false"
OLLAMA_ENABLED = "false"
ABYSS_ENABLED = "true"
FREE_REQUEST_LIMIT = "5"
PRO_REQUEST_LIMIT = "250"
AI_PROVIDER = "gemini"
AI_MODEL = "gemini-2.5-flash"
DOCTRINE_VERSION = "1.0.0"
TURNSTILE_REQUIRED = "false"
INPUT_COST_MICROS_PER_MILLION = "0"
OUTPUT_COST_MICROS_PER_MILLION = "0"

[[d1_databases]]
binding = "DB"
database_name = "self-mirror-test"
database_id = "replace-with-test-d1-id"

[env.test.vars]
ENVIRONMENT = "test"
APP_ORIGIN = "https://burkeonis.com"
FIREBASE_PROJECT_ID = "replace-in-cloudflare"
STRIPE_MONTHLY_PRICE_ID = "replace-in-cloudflare"
STRIPE_YEARLY_PRICE_ID = "replace-in-cloudflare"
BILLING_ENABLED = "true"
OLLAMA_ENABLED = "false"
ABYSS_ENABLED = "true"
FREE_REQUEST_LIMIT = "5"
PRO_REQUEST_LIMIT = "250"
AI_PROVIDER = "gemini"
AI_MODEL = "gemini-2.5-flash"
DOCTRINE_VERSION = "1.0.0"
TURNSTILE_REQUIRED = "true"
INPUT_COST_MICROS_PER_MILLION = "0"
OUTPUT_COST_MICROS_PER_MILLION = "0"

[[env.test.d1_databases]]
binding = "DB"
database_name = "self-mirror-test"
database_id = "replace-with-test-d1-id"
